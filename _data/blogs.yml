# ─────────────────────────────────────────────────────────────────────────
# Our Blogs — data source for /blogs/ (blogs.html)
#
# This lists blog posts that are written FROM the workshop/tutorial material
# in this catalog. The posts themselves live in a separate blog project
# whose publishing format and repo are still TBD — this page only links
# out to them once that project exists and posts are published.
#
# Schema (one list item per post):
#   - title:          string, required  — post headline
#     date:            string, required  — ISO date, "YYYY-MM-DD"
#     author:          string, required  — author name
#     url:             string, required  — full URL to the published post
#     blurb:           string, required  — 1-2 sentence summary
#     tags:            list of strings, optional
#     source_project:  string, optional  — slug of the originating repo
#                      (e.g. the workshop/tutorial repo this post is drawn
#                      from)
#
# Example (commented out — do not uncomment until a real post exists):
#
#   - title: "Five Things We Learned Building a Datamesh on Quarkus"
#     date: "2026-01-15"
#     author: "PatternCatalyst"
#     url: "https://blog.example.com/datamesh-quarkus-lessons"
#     blurb: >
#       Lessons from turning a Quarkus + Kubernetes datamesh workshop into
#       a production-style reference architecture.
#     tags: ["quarkus", "kubernetes", "datamesh"]
#     source_project: "datamesh-quarkus"
#
# blogs.html renders a friendly empty state when the list below is empty.
# ─────────────────────────────────────────────────────────────────────────

- title: "Leave the Toolchain Behind: A C++ Service in 26 MB Instead of 689"
  date: "2026-10-10"
  author: "Pattern Catalyst"
  url: "https://patterncatalyst.github.io/patterncatalyst-blog/2026/10/10/leave-the-toolchain-behind/"
  blurb: >
    A 4 MB C++ binary routinely ships inside a 689 MB image. The fix isn't to
    shrink the toolchain, it's to leave it behind. Multi-stage builds plus the
    right UBI runtime tier get the same service down to 26 MB, and the tier you
    pick is really an incident-response decision, not a size one.
  tags: ["cpp", "containers", "multi-stage-build", "ubi", "image-size"]
  source_project: "cpp-container-optimization-tutorial"

- title: "Who Knows the Sequence? Three Ways to Coordinate an Order Saga in Quarkus"
  date: "2026-10-10"
  author: "Pattern Catalyst"
  url: "https://patterncatalyst.github.io/patterncatalyst-blog/2026/10/10/who-knows-the-sequence/"
  blurb: >
    Kafka choreography, a Camel route, and a Quarkus Flow document coordinate the
    same order-triage saga. The split that matters in an incident isn't
    declarative versus imperative; it's whether any single artifact knows the
    sequence at all.
  tags: ["quarkus", "kafka", "camel", "orchestration", "event-driven", "saga"]
  source_project: "datamesh-reference-arch-quarkus"

- title: "Cardinality, Not Instrumentation, Is What Makes Observability Expensive"
  date: "2026-10-09"
  author: "Pattern Catalyst"
  url: "https://patterncatalyst.github.io/patterncatalyst-blog/2026/10/09/cardinality-is-what-makes-observability-expensive/"
  blurb: >
    A metric is a family of time series, one per label combination; add a single
    unbounded label and a cheap counter becomes a six-figure line item. How
    cardinality drives metric, log, and trace cost, and where to control it.
  tags: ["observability", "opentelemetry", "cardinality", "cost", "metrics"]
  source_project: "otel-observability-tutorial"

- title: "L7 Routing Is a Four-Layer Decision Chain, Not an Appliance in a Rack"
  date: "2026-10-07"
  author: "Pattern Catalyst"
  url: "https://patterncatalyst.github.io/patterncatalyst-blog/2026/10/07/l7-routing-for-cloud-native-apps/"
  blurb: >
    L7 routing in 2026 isn't a box in a rack — it's layered software (edge,
    gateway, mesh, app) making a decision on every HTTP and gRPC envelope,
    and knowing which layer owns which decision is the whole game.
  tags: ["cloud-native", "l7-routing", "kubernetes", "api-gateway", "service-mesh"]
  source_project: "cloud-native-design-patterns"
