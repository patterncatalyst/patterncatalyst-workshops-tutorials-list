# ─────────────────────────────────────────────────────────────────────────
# Blog Links — data source for /blog-links/ (blog-links.html)
#
# Curated external blogs/articles we reference while building these
# workshops and tutorials. These are NOT our own posts (see _data/blogs.yml
# for that) — they're third-party reading relevant to our topics.
#
# Schema (one list item per entry):
#   - title:  string, required — article/post title
#     url:    string, required — full URL to the article
#     source: string, required — publishing site or author name
#     blurb:  string, required — 1-2 sentence summary of why it's relevant
#     tags:   list of strings, optional
#
# Quote any value that contains a colon (YAML parses `key: value` inside an
# unquoted scalar as a nested mapping).
# ─────────────────────────────────────────────────────────────────────────

- title: "Quarkus Blog"
  url: "https://quarkus.io/blog/"
  source: "Quarkus.io"
  blurb: >
    The official Quarkus team blog: release notes, performance deep dives,
    and extension guides straight from the project maintainers.
  tags: ["quarkus", "java"]

- title: "Kubernetes Blog"
  url: "https://kubernetes.io/blog/"
  source: "Kubernetes.io"
  blurb: >
    The official Kubernetes project blog, covering new features, SIG
    updates, and operational guidance from the core maintainers.
  tags: ["kubernetes", "cloud-native"]

- title: "Martin Fowler's Blog"
  url: "https://martinfowler.com/"
  source: "martinfowler.com"
  blurb: >
    Long-running source for domain-driven design, software architecture,
    and refactoring practice; foundational reading for DDD topics.
  tags: ["ddd", "architecture"]

- title: "Sam Newman"
  url: "https://samnewman.io/"
  source: "Sam Newman"
  blurb: >
    Writing on microservices and service decomposition from the author of
    "Building Microservices" and "Monolith to Microservices".
  tags: ["microservices", "architecture"]

- title: "Enterprise Integration Patterns"
  url: "https://www.enterpriseintegrationpatterns.com/"
  source: "Hohpe & Woolf"
  blurb: >
    The canonical catalog of the 65 messaging integration patterns, plus
    Gregor Hohpe's "Ramblings" on messaging and integration.
  tags: ["integration", "messaging", "eip"]

- title: "Apache Camel Blog"
  url: "https://camel.apache.org/blog/"
  source: "camel.apache.org"
  blurb: >
    The Apache Camel project blog: releases, component updates, and
    integration guidance from the maintainers.
  tags: ["camel", "integration"]

- title: "Red Hat Developer Blog"
  url: "https://developers.redhat.com/blog"
  source: "developers.redhat.com"
  blurb: >
    Red Hat's developer blog, covering Quarkus, Camel, OpenShift, and
    Kubernetes with hands-on tutorials and release coverage.
  tags: ["quarkus", "camel", "kubernetes", "openshift"]

- title: "The Architect Elevator"
  url: "https://architectelevator.com/blog/"
  source: "Gregor Hohpe"
  blurb: >
    Gregor Hohpe on enterprise architecture, integration, and connecting
    the technical and executive floors of an organization.
  tags: ["architecture", "integration"]

- title: "Domain Language"
  url: "https://www.domainlanguage.com/"
  source: "Eric Evans"
  blurb: >
    Eric Evans' site on domain-driven design, from the author of the
    original DDD book.
  tags: ["ddd"]

- title: "Vladik Khononov"
  url: "https://vladikk.com/"
  source: "Vlad Khononov"
  blurb: >
    Writing on domain-driven design and software complexity from the author
    of "Learning Domain-Driven Design" and "Balancing Coupling".
  tags: ["ddd", "architecture"]

- title: "Modernes C++"
  url: "https://www.modernescpp.com/"
  source: "Rainer Grimm"
  blurb: >
    Rainer Grimm's blog on modern C++: concurrency, templates, the memory
    model, and the latest standard features with runnable examples.
  tags: ["cpp", "performance"]
