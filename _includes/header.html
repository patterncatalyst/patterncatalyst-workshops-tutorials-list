<header class="site-header" role="banner">
  <div class="site-header__inner">
    <a class="brand" href="{{ '/' | relative_url }}">
      <span class="brand__mark" aria-hidden="true">{{ site.brand_emoji | default: "🧭" }}</span>
      <span>{{ site.title | default: "PatternCatalyst" }}</span>
    </a>
    <nav class="site-nav" aria-label="Primary">
      <a href="{{ '/' | relative_url }}"
         {% if page.url == '/' %}aria-current="page"{% endif %}>Workshops</a>
      <a href="{{ '/blogs/' | relative_url }}"
         {% if page.url contains '/blogs/' %}aria-current="page"{% endif %}>Our Blogs</a>
      <a href="{{ '/blog-links/' | relative_url }}"
         {% if page.url contains '/blog-links/' %}aria-current="page"{% endif %}>Blog Links</a>
      <a href="{{ '/books/' | relative_url }}"
         {% if page.url contains '/books/' %}aria-current="page"{% endif %}>Books</a>
    </nav>
  </div>
</header>
